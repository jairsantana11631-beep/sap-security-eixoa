async function api(path,opt={}){
 try{
  opt.headers={...(opt.headers||{}),"Content-Type":"application/json"};
  if(session?.token)opt.headers.Authorization="Bearer "+session.token;
  let r=await fetch(API+path,opt); let j=await r.json().catch(()=>({}));
  if(!r.ok)throw Error(j.error||"Erro API"); return j;
 }catch(e){
  if(path==="/api/health") return {ok:true,db:"DEMO LOCAL"};
  if(path==="/api/vulnerabilities" && (!opt.method||opt.method==="GET")) return localDB.vulnerabilities;
  if(path==="/api/vulnerabilities" && opt.method==="POST"){
    let b=JSON.parse(opt.body||"{}"), id="VUL-"+String(localDB.vulnerabilities.length+1).padStart(3,"0");
    let v={id,external_id:id,title:b.title,system_name:b.system_name,severity:b.severity,status:"OPEN"};
    localDB.vulnerabilities.unshift(v); localDB.audit.unshift({created_at:new Date().toLocaleString("pt-BR"),action:"vulnerability.create",resource_type:"vulnerability",user_email:session?.email}); localSave(); return v;
  }
  if(path==="/api/users") return localDB.users;
  if(path==="/api/grc/risks") return localDB.grcRisks;
  if(path==="/api/btp/assets") return localDB.btpAssets;
  if(path==="/api/tickets") return localDB.tickets;
  if(path==="/api/compliance/controls") return localDB.controls;
  if(path==="/api/billing/plans") return localDB.plans;
  if(path==="/api/integrations") return localDB.integrations;
  if(path==="/api/audit") return localDB.audit;
  if(path.includes("/api/integrations/")&&path.endsWith("/test")) return {status:"DEMO",message:"Conector navegável. A integração real será ativada com endpoint e credenciais do cliente."};
  throw e;
 }
}

async function monitoring(){
 let vs=[]; try{vs=await api('/api/vulnerabilities')}catch(e){vs=localDB.vulnerabilities||[]}
 if(!Array.isArray(vs))vs=Array.isArray(vs?.items)?vs.items:(localDB.vulnerabilities||[]);
 let gr=[]; try{gr=await api('/api/grc/risks')}catch(e){gr=localDB.grcRisks||[]}
 if(!Array.isArray(gr))gr=Array.isArray(gr?.items)?gr.items:Array.isArray(gr?.risks)?gr.risks:(localDB.grcRisks||[]);
 const crit=vs.filter(v=>String(v.severity).toUpperCase()==='CRITICAL').length, high=vs.filter(v=>String(v.severity).toUpperCase()==='HIGH').length;
 const open=vs.filter(v=>!['RESOLVED','CLOSED'].includes(String(v.status).toUpperCase())).length;
 const sod=gr.filter(r=>!['RESOLVED','MITIGADO'].includes(String(r.status).toUpperCase())).length;
 const score=Math.min(100,38+crit*14+high*7+sod*5);
 const trend=[42,51,48,63,58,72,score]; const days=['D-6','D-5','D-4','D-3','D-2','D-1','Agora'];
 const events=[...vs.slice(0,3).map(v=>({t:v.title,s:v.system_name||'SAP',sev:v.severity})),...gr.slice(0,2).map(r=>({t:r.risk||r.title,s:'GRC / '+(r.area||'SoD'),sev:r.level||'RISK'}))];
 return `<div class="monitor-hero"><div class="docs-head"><div><span class="eyebrow"><span class="live-dot"></span>Monitoramento inteligente</span><h1 style="margin-bottom:7px">SAP Security Operations & Risk Intelligence</h1><p class="muted">Visão operacional consolidada de vulnerabilidades, GRC/SoD, exposição e sinais de risco. Atualização da tela: ${new Date().toLocaleTimeString('pt-BR')}</p></div><button class="btn" onclick="render();toast('Painel atualizado')">↻ Atualizar agora</button></div></div>
 <div class="monitor-kpis"><div class="kpi"><small>Risk Score</small><div class="num ${score>=75?'critical':score>=55?'high':'ok'}">${score}/100</div><div class="riskmeter"><span style="width:${score}%"></span></div></div><div class="kpi"><small>Vulnerabilidades abertas</small><div class="num">${open}</div><small>Em acompanhamento</small></div><div class="kpi"><small>Críticas</small><div class="num critical">${crit}</div><small>Prioridade imediata</small></div><div class="kpi"><small>Altas</small><div class="num high">${high}</div><small>Requerem plano de ação</small></div><div class="kpi"><small>Riscos GRC / SoD</small><div class="num">${sod}</div><small>Não encerrados</small></div></div>
 <div class="monitor-grid" style="margin-top:14px"><div class="chartbox"><div class="docs-head"><div><h3>Tendência do SAP Risk Score</h3><p class="muted">Indicador composto para priorização operacional.</p></div><span class="tag">LIVE</span></div><div class="bars">${asArray(trend).map((x,i)=>`<div class="barcol"><div class="barv" style="height:${Math.max(12,x*1.45)}px" title="${x}/100"></div><b>${x}</b><br>${days[i]}</div>`).join('')}</div></div><div class="chartbox"><h3>Distribuição de risco</h3><div class="donut"></div><p class="muted" style="text-align:center">Crítico • Alto • Médio • Controlado</p></div></div>
 <div class="monitor-grid" style="margin-top:14px"><div class="chartbox"><div class="docs-head"><div><h3>Eventos e achados prioritários</h3><p class="muted">Fila operacional correlacionando Security, GRC e Vulnerabilidades.</p></div><button class="btn secondary" onclick="go('vulnerabilities')">Abrir Vulnerabilidades</button></div>${events.length?events.map(e=>`<div class="event"><b>${esc(e.t)}</b><span class="muted">${esc(e.s)} • </span><span class="tag">${esc(e.sev)}</span></div>`).join(''):'<div class="notice">Nenhum evento prioritário.</div>'}</div><div class="chartbox"><h3>Threat Intelligence SAP — Risk Engine</h3><p>Correlação de severidade, exposição, criticidade do negócio e riscos de autorização.</p><div class="actions"><button class="btn" onclick="openRiskIdentification()">Identificar riscos</button><button class="btn secondary" onclick="openExposureAnalysis()">Analisar exposição</button><button class="btn secondary" onclick="openRiskPrioritization()">Priorizar</button><button class="btn secondary" onclick="openRemediationPlan()">Plano de ação</button></div><hr style="border-color:#1d3550"><h3>IA / Joule — recomendação</h3><p class="muted">Priorize primeiro itens críticos expostos e conflitos SoD ligados a processos financeiros; valide controles compensatórios antes do encerramento.</p><button class="btn secondary" onclick="go('ai')">Abrir IA / Joule</button></div></div>`;
}

function sbConfigured(){
 return !!(window.SUPABASE_URL&&window.SUPABASE_PUBLISHABLE_KEY&&
 !String(window.SUPABASE_URL).includes("COLE_AQUI")&&!String(window.SUPABASE_PUBLISHABLE_KEY).includes("COLE_AQUI"));

 if(!url||!key){toast("Informe a URL e a Publishable/Anon Key do Supabase");return}

let siteAccessCount = null;
function localAccessFallback(){
 let n=parseInt(localStorage.getItem('eixo_site_access_total')||'0',10)||0;
 if(!sessionStorage.getItem('eixo_access_counted')){n++;localStorage.setItem('eixo_site_access_total',String(n));sessionStorage.setItem('eixo_access_counted','1')}

function setAccessCounterEnabled(enabled){localStorage.setItem('eixo_access_counter_enabled',enabled?'1':'0');toast(enabled?'Contador de acessos ATIVADO':'Contador de acessos DESATIVADO');render()}

async function registerSiteAccess(){
 if(!accessCounterEnabled()){siteAccessCount=parseInt(localStorage.getItem('eixo_site_access_total')||'0',10)||0;return}
 if(!sbConfigured()){localAccessFallback();return}
 try{
  if(!sessionStorage.getItem('eixo_access_counted')){
   let r=await sbFetch('/rest/v1/site_accesses',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({page:'site',referrer:(document.referrer||'direct').slice(0,250)})});
   if(!r.ok) throw Error('Tabela site_accesses indisponível');
   sessionStorage.setItem('eixo_access_counted','1');
  }
  let r=await sbFetch('/rest/v1/site_accesses?select=id',{method:'GET',headers:{'Prefer':'count=exact','Range':'0-0'}});
  if(!r.ok) throw Error('Contagem indisponível');
  let range=r.headers.get('content-range')||''; let m=range.match(/\/(\d+)$/);
  siteAccessCount=m?parseInt(m[1],10):null;
 }catch(e){localAccessFallback()}
}
function accessCounterCard(){return `<div class="card access-counter"><b>👁 Acessos ao SAP Security Eixo</b><h2 id="siteAccessCounter">${siteAccessCount==null?'—':Number(siteAccessCount).toLocaleString('pt-BR')}</h2><small class="muted">${accessCounterEnabled()?'Visitas contabilizadas por sessão':'Contador temporariamente desativado'}</small></div>`}

function sbAdminToken(){return sessionStorage.getItem("sb_admin_token")||""}
async function sbFetch(path,opts={},useAdmin=false){
 if(!sbConfigured()) throw new Error("Supabase ainda não configurado. Use o painel Conectar Supabase nesta página.");
 let token=useAdmin?sbAdminToken():sbKey();
 let headers=Object.assign({
  "apikey":sbKey(),
  "Authorization":"Bearer "+token,
  "Content-Type":"application/json"
 },opts.headers||{});
 return fetch(sbBase()+path,Object.assign({},opts,{headers}));
}
async function supabaseAdminLogin(){
 let email=document.getElementById("sbAdminEmail")?.value.trim(),password=document.getElementById("sbAdminPass")?.value;
 if(!email||!password){toast("Informe e-mail e senha da equipe");return}
 try{
  let r=await fetch(sbBase()+"/auth/v1/token?grant_type=password",{
   method:"POST",headers:{"apikey":sbKey(),"Content-Type":"application/json"},
   body:JSON.stringify({email,password})
  });
  let j=await r.json().catch(()=>({}));
  if(!r.ok)throw Error(j.error_description||j.msg||j.message||"Falha no login Supabase");
  sessionStorage.setItem("sb_admin_token",j.access_token);
  toast("Equipe autenticada");render();
 }catch(e){toast("Erro: "+e.message)}
}
function supabaseAdminLogout(){sessionStorage.removeItem("sb_admin_token");render()}

async function submitCveAlert(){
 const data={
  contact_name:document.getElementById('cveName')?.value.trim(),
  corporate_email:document.getElementById('cveEmail')?.value.trim(),
  company_name:document.getElementById('cveCompany')?.value.trim(),
  cnpj:document.getElementById('cveCnpj')?.value.trim()||null,
  phone:document.getElementById('cvePhone')?.value.trim()||null,
  sap_systems:document.getElementById('cveSystems')?.value.trim(),
  minimum_severity:document.getElementById('cveSeverity')?.value||'CRITICAL',
  active:true
 };
 const result=document.getElementById('cveRegisterResult');
 if(!data.contact_name||!data.corporate_email||!data.company_name||!data.sap_systems){
  toast('Preencha nome, e-mail, empresa e sistemas de interesse');return;
 }
 try{
  let r=await sbFetch("/rest/v1/cve_alert_subscriptions",{
   method:"POST",
   headers:{"Prefer":"return=representation"},
   body:JSON.stringify(data)
  });
  let j=await r.json().catch(()=>[]);
  if(!r.ok)throw Error(j?.message||j?.hint||j?.details||"Falha ao cadastrar");
  let item=Array.isArray(j)?j[0]:j;
  if(result) result.innerHTML=`<div class="notice"><b>Cadastro realizado com sucesso.</b><br>ID: ${esc(item?.id||"gerado")}<br>O registro já está disponível para a equipe em Administração → Alertas CVE.</div>`;
  toast('Empresa cadastrada para alertas CVE');
  ['cveName','cveEmail','cveCompany','cveCnpj','cvePhone','cveSystems'].forEach(id=>{let el=document.getElementById(id);if(el)el.value=''});
 }catch(e){
  if(result) result.innerHTML=`<div class="notice"><b>Não foi possível concluir o cadastro.</b><br>${esc(e.message)}<br><br>${!sbConfigured()?'<b>Configuração:</b> use o painel Conectar Supabase acima.':''}</div>`;
  toast('Erro no cadastro: '+e.message);
 }
}

 <div class="v8-grid"><div class="v8-card"><h3>Remediação</h3><p class="muted">Detectar → priorizar → atribuir → corrigir → validar → evidenciar → encerrar.</p><button class="btn" onclick="openRemediationPlan()">Plano de ação</button></div><div class="v8-card"><h3>Threat Intelligence</h3><p class="muted">Contexto de exploração e ameaça separado da fraqueza técnica, mas correlacionado ao mesmo CVE.</p><button class="btn secondary" onclick="openThreatIntel()">Abrir inteligência</button></div><div class="v8-card"><h3>Alertas & Supabase</h3><p class="muted">Cadastro de empresas, ativos, responsáveis, SLA, histórico e evidências.</p><button class="btn secondary" onclick="openV8Alerts()">Configurar alertas</button></div></div>`+await documentsPanel('vulnerabilities','Vulnerabilidades');
}
function eixoRiskScore(v){let cv=Math.min(10,Number(v.cvss||({CRITICAL:9.5,HIGH:8,MEDIUM:5.5,LOW:2}[String(v.severity).toUpperCase()]||5)))*5;let ep=Math.min(1,Number(v.epss||0))*25;let kev=v.kev?15:0,ex=v.exploit?5:0,asset=String(v.asset_criticality||'').toLowerCase()==='critical'?5:String(v.asset_criticality||'').toLowerCase()==='high'?3:0;return Math.min(100,Math.round(cv+ep+kev+ex+asset))}
function riskClass(n){return n>=85?'risk-critical':n>=70?'risk-high':n>=45?'risk-medium':'risk-low'}
function openV8Finding(raw){let v=JSON.parse(raw),score=eixoRiskScore(v);document.getElementById('detailModal')?.remove();let e=document.createElement('div');e.className='modalback';e.id='detailModal';e.innerHTML=`<div class="modal"><button class="close" onclick="closeDetail()">Fechar</button><span class="v8-badge">V8 • FINDING</span><h2>${esc(v.external_id||'Vulnerabilidade')}</h2><div class="metric-grid"><div class="metric-card"><small>Eixo Risk Score</small><strong class="${riskClass(score)}">${score}/100</strong></div><div class="metric-card"><small>CVSS</small><strong>${esc(v.cvss??'-')}</strong></div><div class="metric-card"><small>EPSS</small><strong>${v.epss!=null?Math.round(Number(v.epss)*100)+'%':'-'}</strong></div><div class="metric-card"><small>KEV</small><strong>${v.kev?'SIM':'NÃO'}</strong></div></div><div class="grid"><div class="lesson"><h3>Ativo SAP</h3><p>${esc(v.system_name||'-')} • ${esc(v.environment||'-')} • ${esc(v.exposure||'-')}</p></div><div class="lesson"><h3>Correção</h3><p>${esc(v.note||'Validar SAP Security Note / patch aplicável')}</p></div><div class="lesson"><h3>Governança</h3><p>Status: ${esc(v.status||'OPEN')} • registrar owner, SLA e evidência.</p></div></div><div class="notice"><b>Próximo passo:</b> validar versão/componente afetado, confirmar aplicabilidade da correção, definir janela e registrar evidência técnica após remediação.</div></div>`;document.body.appendChild(e)}

async function submitSupportTicket(){let data={name:document.getElementById('tkName').value.trim(),email:document.getElementById('tkEmail').value.trim(),company:document.getElementById('tkCompany').value.trim(),area:document.getElementById('tkArea').value,priority:document.getElementById('tkPriority').value,subject:document.getElementById('tkSubject').value.trim(),description:document.getElementById('tkDescription').value.trim()};if(!data.name||!data.email||!data.subject||!data.description){toast("Preencha nome, e-mail, assunto e descrição");return}let nums=(localDB.tickets||[]).map(t=>Number(String(t.id||'').replace(/\D/g,''))).filter(Number.isFinite);let next=Math.max(1000,...nums)+1;let id="INC-"+next;let created_at=new Date().toISOString();localDB.tickets.unshift({id,title:data.subject,priority:data.priority,status:"Aberto",area:data.area,name:data.name,email:data.email,company:data.company,description:data.description,created_at});localSave();try{await submitNetlifyForm("support-ticket",{...data,id,created_at});toast(id+" aberto com sucesso")}catch(e){toast(id+" salvo para atendimento")}await render();openTicket(id)}

async function setCveAlertStatus(id,active){
 try{
  let r=await sbFetch("/rest/v1/cve_alert_subscriptions?id=eq."+encodeURIComponent(id),{
   method:"PATCH",
   headers:{"Prefer":"return=minimal"},
   body:JSON.stringify({active:!!active,updated_at:new Date().toISOString()})
  },true);
  if(!r.ok){let j=await r.json().catch(()=>({}));throw Error(j.message||"Falha")}
  toast(active?'Alerta ativado':'Alerta desativado');render();
 }catch(e){toast('Erro: '+e.message)}
}

function academyUsers(){try{return JSON.parse(localStorage.getItem(ACADEMY_USERS_KEY)||'[]')}catch(e){return []}}
function saveAcademyUsers(users){localStorage.setItem(ACADEMY_USERS_KEY,JSON.stringify(users))}
async function academyHash(value){try{const data=new TextEncoder().encode(value);const out=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(out)).map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(unescape(encodeURIComponent(value)))}}

async function academyRegister(){
 const name=($('academyRegName')?.value||'').trim(),email=($('academyRegEmail')?.value||'').trim().toLowerCase(),user=($('academyRegUser')?.value||'').trim().toLowerCase(),pass=$('academyRegPass')?.value||'',pass2=$('academyRegPass2')?.value||'';
 if(!name||!email||!user||!pass){toast('Preencha todos os campos');return} if(pass.length<6){toast('A senha deve ter pelo menos 6 caracteres');return} if(pass!==pass2){toast('As senhas não conferem');return}
 let users=academyUsers();if(users.some(x=>x.user===user||x.email===email)){toast('Usuário ou e-mail já cadastrado');return}
 users.push({id:'ACD-'+String(users.length+1).padStart(4,'0'),name,email,user,password_hash:await academyHash(pass),created_at:new Date().toISOString()});saveAcademyUsers(users);toast('Cadastro criado. Faça o login.');$('view').innerHTML=academyAuthView('login')
}
async function academyLogin(){
 const login=($('academyLoginUser')?.value||'').trim().toLowerCase(),pass=$('academyLoginPass')?.value||'';let users=academyUsers();let u=users.find(x=>x.user===login||x.email===login);if(!u||u.password_hash!==await academyHash(pass)){toast('Usuário ou senha inválidos');return}
 academySession={id:u.id,name:u.name,email:u.email,user:u.user,login_at:new Date().toISOString()};sessionStorage.setItem(ACADEMY_SESSION_KEY,JSON.stringify(academySession));toast('Bem-vindo à Academy');render()
}
function academyLogout(){sessionStorage.removeItem(ACADEMY_SESSION_KEY);academySession=null;toast('Sessão da Academy encerrada');render()}

function ensureAcademyCatalog(){
 const old=asArray(localDB.courses),state={};
 old.forEach(c=>{if(c?.id)state[c.id]={progress:+c.progress||0,done:asArray(c.done),quizScores:c.quizScores||{},exam:c.exam||null}});
 localDB.courses=ACADEMY_CATALOG.map(c=>({...c,progress:state[c.id]?.progress||0,done:state[c.id]?.done||[],quizScores:state[c.id]?.quizScores||{},exam:state[c.id]?.exam||null}));
 localSave();return localDB.courses;
}
async function academy(){
 ensureAcademyCatalog();let user=academyUser();
 if(!user)return `<section class="study-hero"><div class="study-kicker">Academy</div><h1>Academy SAP Security Eixo 2026</h1><p>Cursos completos com aulas, quizzes técnicos e simulados.</p></section><div class="card" style="max-width:760px;margin:18px auto"><h2>Entrar na Academy</h2><div class="form-grid"><div><label>Nome</label><input id="academyName"></div><div><label>E-mail</label><input id="academyEmail" type="email"></div><div><label>Senha</label><input id="academyPass" type="password"></div></div><div class="actions"><button class="btn" onclick="academyRegister()">Cadastrar e entrar</button><button class="btn secondary" onclick="academyLogin()">Entrar</button></div><div class="study-note">Preparatório independente; não é treinamento nem certificação oficial SAP.</div></div>`;
 return `<section class="study-hero"><div class="study-kicker">Academy</div><h1>Academy SAP Security Eixo 2026</h1><p>Olá, ${esc(user.name)}. Cursos, progresso, quizzes e simulados em ambiente separado.</p></section><div class="grid">${asArray(localDB.courses).map(c=>`<div class="card"><span class="tag ok">${esc(c.level)}</span><h2>${esc(c.name)}</h2><p>${esc(c.desc)}</p><p><b>${asArray(c.modules).length} módulos</b> · ${c.hours}h</p><p>Progresso: <b>${c.progress||0}%</b></p><div style="height:8px;background:#07111f;border-radius:8px;overflow:hidden"><div style="height:100%;width:${c.progress||0}%;background:#35a7ff"></div></div><br><div class="actions"><button class="btn" onclick="openAcademyCourse('${c.id}')">Entrar no curso</button><button class="btn secondary" onclick="openAcademyPdf('${c.id}')">Ler PDF</button></div></div>`).join('')}</div><div class="actions" style="margin-top:16px"><button class="btn secondary" onclick="academyLogout()">Sair da Academy</button></div>`;
}
function academyUser(){try{return JSON.parse(localStorage.getItem('academy_user')||'null')}catch{return null}}
function academyRegister(){let name=document.getElementById('academyName')?.value.trim(),email=document.getElementById('academyEmail')?.value.trim(),pass=document.getElementById('academyPass')?.value;if(!name||!email||!pass){toast('Preencha nome, e-mail e senha');return}let users=JSON.parse(localStorage.getItem('academy_users')||'[]');if(users.some(u=>u.email===email)){toast('E-mail já cadastrado');return}users.push({name,email,pass});localStorage.setItem('academy_users',JSON.stringify(users));localStorage.setItem('academy_user',JSON.stringify({name,email}));render()}
function academyLogin(){let email=document.getElementById('academyEmail')?.value.trim(),pass=document.getElementById('academyPass')?.value;let users=JSON.parse(localStorage.getItem('academy_users')||'[]'),u=users.find(x=>x.email===email&&x.pass===pass);if(!u){toast('E-mail ou senha inválidos');return}localStorage.setItem('academy_user',JSON.stringify({name:u.name,email:u.email}));render()}
function academyLogout(){localStorage.removeItem('academy_user');render()}
function academyCourse(id){ensureAcademyCatalog();return asArray(localDB.courses).find(x=>x.id===id)}

const ACADEMY_PDFS={"sec": "Academy_SAP_Security_Professional_2026.pdf", "grc": "Academy_SAP_GRC_Professional_2026.pdf", "btp": "Academy_SAP_BTP_Professional_2026.pdf", "joule": "Academy_SAP_IA_Joule_Professional_2026.pdf"};
function academyPdf(id){return ACADEMY_PDFS[id]||((id==="cloudai"||id==="joule")?"Academy_SAP_IA_Joule_Professional_2026.pdf":"");}
function openAcademyPdf(id){

function openAcademyCourse(id){let c=academyCourse(id);if(!c)return;document.getElementById('view').innerHTML=`<button class="btn secondary" onclick="render()">← Voltar à Academy</button><div class="card" style="margin-top:15px"><span class="tag ok">${esc(c.level)}</span><h1>${esc(c.name)}</h1><p>${esc(c.desc)}</p><p><b>${c.hours}h</b> · <b>${asArray(c.modules).length} módulos</b></p><div class="actions"><button class="btn" onclick="openAcademyPdf('${id}')">Ler apostila PDF do curso</button><a class="btn secondary" href="${academyPdf(id)}" target="_blank" rel="noopener">Abrir PDF em nova aba</a></div></div><div class="grid">${asArray(c.modules).map((m,i)=>`<div class="card"><span class="tag">Módulo ${i+1}</span><h3>${esc(m.title)}</h3><p>${esc(m.content)}</p><p class="muted">Quiz: ${c.quizScores?.[i]!=null?c.quizScores[i]+'%':'não realizado'}</p><div class="actions"><button class="btn secondary" onclick="openAcademyLesson('${id}',${i})">Abrir aula</button><button class="btn secondary" onclick="startModuleQuiz('${id}',${i})">Quiz técnico</button></div></div>`).join('')}</div><div class="card" style="margin-top:18px"><h2>Simulado de Certificação — ${esc(c.name)}</h2><p>20 questões, pontuação, percentual de acertos e opção de refazer.</p>${c.exam?`<p><b>Último resultado:</b> ${c.exam.correct}/${c.exam.total} — ${c.exam.percent}%</p>`:''}<button class="btn" onclick="startCertificationExam('${id}')">Iniciar simulado</button></div>`}
function openAcademyLesson(id,n){let c=academyCourse(id),m=asArray(c?.modules)[n];if(!m)return;document.getElementById('view').innerHTML=`<button class="btn secondary" onclick="openAcademyCourse('${id}')">← Voltar ao curso</button><div class="card" style="margin-top:15px"><span class="tag ok">${esc(c.name)} · Módulo ${n+1}</span><h1>${esc(m.title)}</h1><p>${esc(m.content)}</p><hr><h3>Objetivos</h3><ul><li>Compreender o conceito e sua aplicação.</li><li>Relacionar o tema com risco, segurança e governança.</li><li>Aplicar o conteúdo em cenário profissional.</li></ul><h3>Prática orientada</h3><p>Analise um cenário, identifique controles, documente a decisão e registre evidências.</p><div class="actions"><button class="btn" onclick="completeAcademyLesson('${id}',${n})">Concluir aula</button><button class="btn secondary" onclick="startModuleQuiz('${id}',${n})">Fazer Quiz Técnico</button></div></div>`}
function completeAcademyLesson(id,n){let c=academyCourse(id);if(!c)return;c.done=c.done||[];if(!c.done.includes(n))c.done.push(n);c.progress=Math.round(c.done.length/Math.max(1,asArray(c.modules).length)*100);localSave();toast('Aula concluída · '+c.progress+'%');openAcademyCourse(id)}
function qname(id,n,q){return `q_${id}_${n}_${q}`}
function startModuleQuiz(id,n){let c=academyCourse(id),m=asArray(c?.modules)[n],qs=asArray(m?.quiz);if(!m)return;document.getElementById('view').innerHTML=`<button class="btn secondary" onclick="openAcademyCourse('${id}')">← Voltar ao curso</button><div class="card"><h1>Quiz Técnico — ${esc(m.title)}</h1><p>${qs.length} questões · meta: 70%.</p></div>${qs.map((q,qi)=>`<div class="card"><h3>${qi+1}. ${esc(q.q)}</h3>${asArray(q.options).map(o=>`<label style="display:block;padding:8px"><input type="radio" name="${qname(id,n,qi)}" value="${esc(o)}"> ${esc(o)}</label>`).join('')}</div>`).join('')}<div class="actions"><button class="btn" onclick="gradeModuleQuiz('${id}',${n})">Verificar acertos</button><button class="btn secondary" onclick="startModuleQuiz('${id}',${n})">Refazer exercício</button></div><div id="quizResult"></div>`}
function gradeModuleQuiz(id,n){let c=academyCourse(id),m=asArray(c?.modules)[n],qs=asArray(m?.quiz),correct=0,unanswered=0;qs.forEach((q,i)=>{let v=document.querySelector(`input[name="${qname(id,n,i)}"]:checked`)?.value;if(!v)unanswered++;else if(v===q.correct)correct++});let pct=Math.round(correct/Math.max(1,qs.length)*100);c.quizScores=c.quizScores||{};c.quizScores[n]=pct;localSave();document.getElementById('quizResult').innerHTML=`<div class="card"><h2>${pct>=70?'Aprovado no quiz':'Revisão recomendada'}</h2><p><b>Acertos:</b> ${correct}/${qs.length} · <b>Resultado:</b> ${pct}% · <b>Não respondidas:</b> ${unanswered}</p><div class="actions"><button class="btn" onclick="startModuleQuiz('${id}',${n})">Refazer exercício</button><button class="btn secondary" onclick="openAcademyCourse('${id}')">Voltar ao curso</button></div></div>`}
function examQuestions(c){let pool=[];asArray(c.modules).forEach(m=>asArray(m.quiz).forEach(q=>pool.push(q)));let out=[],step=Math.max(1,Math.floor(pool.length/20));for(let i=0;i<pool.length&&out.length<20;i+=step)out.push(pool[i]);return out.slice(0,20)}
function startCertificationExam(id){let c=academyCourse(id),qs=examQuestions(c);document.getElementById('view').innerHTML=`<button class="btn secondary" onclick="openAcademyCourse('${id}')">← Voltar ao curso</button><div class="card"><h1>Simulado — ${esc(c.name)}</h1><p>${qs.length} questões · meta de referência 70%. Preparatório independente, não reproduz prova oficial SAP.</p></div>${qs.map((q,i)=>`<div class="card"><h3>${i+1}. ${esc(q.q)}</h3>${asArray(q.options).map(o=>`<label style="display:block;padding:8px"><input type="radio" name="exam_${id}_${i}" value="${esc(o)}"> ${esc(o)}</label>`).join('')}</div>`).join('')}<div class="actions"><button class="btn" onclick="gradeCertificationExam('${id}')">Finalizar e verificar</button><button class="btn secondary" onclick="startCertificationExam('${id}')">Reiniciar simulado</button></div><div id="examResult"></div>`}
function gradeCertificationExam(id){let c=academyCourse(id),qs=examQuestions(c),correct=0,unanswered=0;qs.forEach((q,i)=>{let v=document.querySelector(`input[name="exam_${id}_${i}"]:checked`)?.value;if(!v)unanswered++;else if(v===q.correct)correct++});let pct=Math.round(correct/Math.max(1,qs.length)*100);c.exam={correct,total:qs.length,percent:pct,date:new Date().toISOString()};localSave();document.getElementById('examResult').innerHTML=`<div class="card"><h2>${pct>=70?'Aprovado no simulado':'Abaixo da meta'}</h2><p><b>Acertos:</b> ${correct}/${qs.length} · <b>Percentual:</b> ${pct}% · <b>Não respondidas:</b> ${unanswered}</p><div class="actions"><button class="btn" onclick="startCertificationExam('${id}')">Refazer simulado</button><button class="btn secondary" onclick="openAcademyCourse('${id}')">Voltar ao curso</button></div></div>`}

 if(!isAdmin) return `<h1>Painel de Conteúdo</h1><div class="notice">Seu perfil não possui permissão para publicar conteúdo.</div>`;
 let items=(localDB.contents||[]).slice().sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
 return `<h1>Painel de Conteúdo</h1><p class="muted">Crie, edite e publique matérias, documentos, PDFs, vídeos e áudios.</p><button class="btn" onclick="editContent()">+ Nova matéria / artigo</button>${await mediaLibraryPanel('conteudo','Conteúdo Geral')}<div class="card" style="margin-top:15px"><table class="table"><tr><th>Título</th><th>Tipo</th><th>Categoria</th><th>Status</th><th>Data</th><th>Ações</th></tr>${asArray(items).map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.type)}</td><td>${esc(x.category)}</td><td><span class="tag">${esc(x.status)}</span></td><td>${new Date(x.created_at).toLocaleDateString('pt-BR')}</td><td><div class="actions"><button class="btn secondary" onclick="editContent('${esc(x.id)}')">Editar</button><button class="btn secondary" onclick="toggleContent('${esc(x.id)}')">${x.status==='PUBLISHED'?'Despublicar':'Publicar'}</button><button class="btn secondary" onclick="deleteContent('${esc(x.id)}')">Excluir</button></div></td></tr>`).join("")}</table></div>`
}
function editContent(id){
 let x=id?(localDB.contents||[]).find(a=>a.id===id):null;
 let e=document.createElement('div');e.className='modalback';e.id='contentModal';
 e.innerHTML=`<div class="modal"><button class="close" onclick="closeContentEditor()">Fechar</button><h2>${x?'Editar publicação':'Nova publicação'}</h2>
 <div class="field"><label>Tipo</label><select id="ctType">${['Artigo','Material','Vídeo','Curso','Comunicado'].map(v=>`<option ${x?.type===v?'selected':''}>${v}</option>`).join('')}</select></div>
 <div class="field"><label>Categoria</label><select id="ctCategory">${['SAP Security','SAP GRC','SAP BTP','IA / Joule','Compliance','Vulnerabilidades','Governança'].map(v=>`<option ${x?.category===v?'selected':''}>${v}</option>`).join('')}</select></div>
 <div class="field"><label>Título</label><input id="ctTitle" value="${esc(x?.title||'')}"></div>
 <div class="field"><label>Resumo</label><textarea id="ctSummary" style="min-height:90px">${esc(x?.summary||'')}</textarea></div>
 <div class="field"><label>Conteúdo</label><textarea id="ctBody">${esc(x?.body||'')}</textarea></div>
 <div class="field"><label>Autor</label><input id="ctAuthor" value="${esc(x?.author||session?.name||'Security Admin')}"></div>
 <div class="actions"><button class="btn" onclick="saveContent('${esc(x?.id||'')}','DRAFT')">Salvar rascunho</button><button class="btn" onclick="saveContent('${esc(x?.id||'')}','PUBLISHED')">Salvar e publicar</button></div></div>`;
 document.body.appendChild(e)
}
function saveContent(id,status){
 let title=document.getElementById('ctTitle').value.trim(); if(!title){toast('Informe o título');return}
 let current=id?(localDB.contents||[]).find(a=>a.id===id):null;
 let obj={id:current?.id||('CNT-'+String((localDB.contents||[]).length+1).padStart(3,'0')),type:ctType.value,category:ctCategory.value,title,summary:ctSummary.value.trim(),body:ctBody.value.trim(),status,author:ctAuthor.value.trim()||session?.name||'Security Admin',created_at:current?.created_at||new Date().toISOString(),updated_at:new Date().toISOString()};
 if(current) Object.assign(current,obj); else localDB.contents.unshift(obj);
 localDB.audit.unshift({created_at:new Date().toLocaleString('pt-BR'),action:current?'content.update':'content.create',resource_type:obj.type,user_email:session.email});
 localSave();closeContentEditor();go('contentAdmin');render();toast(status==='PUBLISHED'?'Conteúdo publicado':'Rascunho salvo')
}
function toggleContent(id){let x=(localDB.contents||[]).find(a=>a.id===id);if(!x)return;x.status=x.status==='PUBLISHED'?'DRAFT':'PUBLISHED';x.updated_at=new Date().toISOString();localSave();render();toast(x.status==='PUBLISHED'?'Conteúdo publicado':'Conteúdo despublicado')}
function deleteContent(id){let x=(localDB.contents||[]).find(a=>a.id===id);if(!x)return;if(!confirm('Excluir esta publicação?'))return;localDB.contents=localDB.contents.filter(a=>a.id!==id);localSave();render();toast('Publicação excluída')}
function openContent(id){let x=(localDB.contents||[]).find(a=>a.id===id);if(!x)return;let e=document.createElement('div');e.className='modalback';e.id='detailModal';e.innerHTML=`<div class="modal"><button class="close" onclick="closeDetail()">Fechar</button><span class="tag">${esc(x.type)}</span><h2>${esc(x.title)}</h2><p class="muted">${esc(x.category)} • ${esc(x.author)} • ${new Date(x.created_at).toLocaleDateString('pt-BR')}</p><p><b>${esc(x.summary||'')}</b></p><div class="lesson" style="white-space:pre-wrap;line-height:1.6">${esc(x.body||'')}</div></div>`;document.body.appendChild(e)}
function closeContentEditor(){document.getElementById('contentModal')?.remove()}

async function ai(){
 let base=`<h1>IA / Joule</h1><div class="card purpose"><h3>Para que serve este módulo?</h3><p>Aplica IA como apoio à interpretação de riscos, SoD, vulnerabilidades, evidências e consultas de segurança. Os botões agora abrem um assunto específico antes de executar qualquer análise.</p></div>
 <div class="grid">
  <div class="card"><h3>Analisar vulnerabilidade</h3><p>Risco, impacto, criticidade, prioridade e próximos passos.</p><button class="btn" onclick="openTopic('jouleVulnerability')">Abrir análise de vulnerabilidade</button></div>
  <div class="card"><h3>Analisar SoD</h3><p>Conflito, impacto no processo, mitigação e decisão.</p><button class="btn" onclick="openTopic('jouleSoD')">Abrir análise SoD</button></div>
  <div class="card"><h3>Gerar evidência</h3><p>Estrutura evidência para auditoria, responsável e rastreabilidade.</p><button class="btn" onclick="openTopic('jouleEvidence')">Abrir geração de evidência</button></div>
  <div class="card"><h3>Assistente de Segurança</h3><p>Perguntas contextuais sobre Security, GRC, BTP e Compliance.</p><button class="btn" onclick="openTopic('jouleAssistant')">Abrir assistente</button></div>
 </div>
 <div class="notice" id="aiout">O conteúdo base funciona sem IA. Dentro de cada assunto, o botão “Threat Intelligence SAP” pode complementar a análise quando a integração estiver configurada.</div>`;
 return base+await documentsPanel('joule','IA / Joule')
}
async function aiRun(type){
 let localMsg=type==="sod"?"Conflito SoD detectado: validar funções incompatíveis, impacto financeiro e controle compensatório.":type==="evidence"?"Evidência estruturada: usuário, role, risco, decisão, responsável, data e aprovação.":"Análise: priorizar risco, validar autorização, aplicar menor privilégio e registrar evidência.";
 try{
   let r=await api("/api/ai/analyze",{method:"POST",body:JSON.stringify({type,context:"tenant_security_context"})});
   document.getElementById("aiout").textContent=r.analysis||localMsg;
 }catch(e){document.getElementById("aiout").textContent=localMsg}
 localDB.audit.unshift({created_at:new Date().toLocaleString("pt-BR"),action:"ai.analyze",resource_type:type,user_email:session.email});localSave()
}

}

const TOPICS={
 roleDesign:{title:"Role Design — PFCG, SU24 e menor privilégio",area:"SAP Security",body:`<div class="lesson"><h3>O que é</h3><p>Role Design é a disciplina de transformar responsabilidades de negócio em acessos SAP controlados. A role deve entregar somente o necessário para a função do usuário, evitando permissões amplas e combinações desnecessárias.</p></div><div class="lesson"><h3>Como funciona na prática</h3><p><b>PFCG</b> é a transação central de manutenção de roles. O menu da role reúne transações, aplicações e serviços; o perfil de autorização define os objetos e valores permitidos. A <b>SU24</b> mantém propostas de autorização que ajudam a PFCG a preencher objetos e valores padrão de forma consistente.</p></div><div class="lesson"><h3>Boas práticas</h3><p>Desenhe roles por função de negócio, separe acessos operacionais de acessos privilegiados, use valores organizacionais restritos, evite curingas desnecessários, documente o proprietário da role e revise impactos de upgrade com SU25/SU24.</p></div><div class="lesson"><h3>O que revisar</h3><p>Transações críticas, objetos com ACTVT amplo, campos organizacionais, serviços RFC/OData, combinações SoD, usuários atribuídos, roles compostas/derivadas e evidências de aprovação.</p></div>`},
 identity:{title:"Identity — Usuários SAP e contas técnicas",area:"SAP Security",body:`<div class="lesson"><h3>O que é</h3><p>Identity trata do ciclo de vida das identidades que acessam o SAP: criação, alteração, bloqueio, desligamento, autenticação e associação das roles corretas a cada usuário.</p></div><div class="lesson"><h3>Usuários humanos x contas técnicas</h3><p>Usuários dialog devem ser ligados a uma pessoa e a uma necessidade de negócio. Contas técnicas, de comunicação, batch ou integração precisam de proprietário, finalidade documentada, senha/segredo protegido e permissões estritamente limitadas.</p></div><div class="lesson"><h3>Controles importantes</h3><p>Recertificação periódica, bloqueio de contas inativas, revisão de usuários genéricos, MFA/SSO quando aplicável, segregação de administradores, expiração de acessos temporários e trilha de quem solicitou, aprovou e executou a mudança.</p></div><div class="lesson"><h3>Risco típico</h3><p>O maior problema não é apenas “quem tem acesso”, mas identidades sem dono, privilégios acumulados ao longo do tempo e contas técnicas com poderes além do necessário.</p></div>`},
 riskEngine:{title:"Risk Engine — Riscos e autorizações críticas",area:"SAP Security",body:`<div class="lesson"><h3>O que é</h3><p>É a visão de risco aplicada aos acessos: identifica permissões críticas, combinações perigosas, privilégios excessivos e situações que podem permitir fraude, erro ou alteração indevida.</p></div><div class="lesson"><h3>O que analisar</h3><p>Ações críticas, permissões críticas, conflitos SoD, acesso administrativo, alterações em dados mestres, manutenção de usuários/roles, execução de programas sensíveis e acessos que contornam controles normais.</p></div><div class="lesson"><h3>Priorização</h3><p>Classifique por impacto, probabilidade, ambiente, criticidade do processo, quantidade de usuários afetados e existência de controle compensatório. Nem todo achado tem o mesmo peso.</p></div><div class="lesson"><h3>Resultado esperado</h3><p>Cada risco deve ter responsável, decisão, prazo e evidência: remover acesso, redesenhar role, mitigar temporariamente, monitorar ou aceitar formalmente o risco.</p></div>`},
 evidence:{title:"Evidence — Trilha de auditoria e comprovação",area:"SAP Security",body:`<div class="lesson"><h3>O que é</h3><p>Evidence é o conjunto de registros que prova que o controle realmente existiu e foi executado. Em auditoria, não basta afirmar que o acesso é controlado; é preciso demonstrar quem solicitou, quem aprovou, o que mudou e quando.</p></div><div class="lesson"><h3>Exemplos de evidência</h3><p>Logs de alteração de usuários e roles, tickets aprovados, relatórios de recertificação, análise SoD, logs de Firefighter, traces de autorização, screenshots controladas, relatórios de execução e registros de remediação.</p></div><div class="lesson"><h3>Qualidade da evidência</h3><p>Deve ser rastreável, datada, íntegra, associada ao controle e ao responsável. Evidência manual sem contexto ou sem identificação costuma perder valor em auditoria.</p></div><div class="lesson"><h3>Uso executivo</h3><p>Uma boa trilha reduz tempo de auditoria, facilita investigação de incidentes e mostra que segurança, compliance e operação estão conectados.</p></div>`},
 ara:{title:"ARA — Access Risk Analysis",area:"SAP GRC Access Control",body:`<div class="lesson"><h3>Para que serve</h3><p>ARA analisa riscos de acesso antes e depois da concessão. Ele procura conflitos de Segregação de Funções (SoD), ações críticas e permissões críticas em usuários, roles, perfis e outros objetos suportados pelo SAP Access Control.</p></div><div class="lesson"><h3>Exemplo simples</h3><p>Se uma pessoa pode criar um fornecedor e também efetuar um pagamento, existe um risco de concentração de atividades incompatíveis. O ARA identifica essa combinação com base no Rule Set configurado.</p></div><div class="lesson"><h3>Como usar bem</h3><p>Mantenha o Rule Set alinhado ao processo real da empresa, execute sincronizações corretamente, valide falsos positivos, simule riscos antes de aprovar acessos e diferencie risco técnico de risco de negócio.</p></div><div class="lesson"><h3>Resultado</h3><p>O ARA ajuda o aprovador a decidir se o acesso deve ser removido, alterado, mitigado ou aceito. A qualidade da análise depende diretamente da qualidade do Rule Set e dos dados sincronizados.</p></div>`},
 arm:{title:"ARM — Access Request Management",area:"SAP GRC Access Control",body:`<div class="lesson"><h3>Para que serve</h3><p>ARM organiza solicitações de acesso em um fluxo controlado: quem pede, qual acesso precisa, por que precisa, quem deve aprovar e como o acesso será provisionado.</p></div><div class="lesson"><h3>Fluxo típico</h3><p>Solicitação → análise de risco → aprovação do gestor ou owner → aprovação de segurança quando necessária → provisionamento → registro de resultado. O workflow pode ser desenhado com MSMP.</p></div><div class="lesson"><h3>Valor para a empresa</h3><p>Reduz concessões informais, padroniza aprovações, cria rastreabilidade e permite incorporar análise SoD antes da liberação do acesso.</p></div><div class="lesson"><h3>Pontos de atenção</h3><p>Catálogo de roles claro, aprovadores corretos, regras de caminho bem definidas, prazos, tratamento de rejeições, acessos temporários e integração com os sistemas-alvo.</p></div>`},
 brm:{title:"BRM — Business Role Management",area:"SAP GRC Access Control",body:`<div class="lesson"><h3>Para que serve</h3><p>BRM governa o ciclo de vida das Business Roles. Ele ajuda a estruturar criação, alteração, aprovação, documentação e manutenção das roles de forma padronizada.</p></div><div class="lesson"><h3>Por que é importante</h3><p>Sem governança de roles, o ambiente tende a acumular roles duplicadas, antigas, sem owner, com nomenclatura inconsistente e permissões excessivas. BRM cria disciplina sobre esse ciclo.</p></div><div class="lesson"><h3>O que uma boa role deve ter</h3><p>Nome padronizado, descrição de negócio, responsável, sistema-alvo, metodologia de desenho, riscos conhecidos, etapa de aprovação, documentação e revisão periódica.</p></div><div class="lesson"><h3>Resultado</h3><p>Roles mais previsíveis, menos retrabalho, melhor integração entre Segurança SAP e GRC e maior facilidade para auditoria e recertificação.</p></div>`},
 eam:{title:"EAM — Emergency Access Management",area:"SAP GRC Access Control",body:`<div class="lesson"><h3>Para que serve</h3><p>EAM controla acesso emergencial privilegiado, normalmente conhecido como Firefighter. Ele permite executar atividades excepcionais sem transformar o usuário em administrador permanente.</p></div><div class="lesson"><h3>Como funciona</h3><p>O acesso é vinculado a uma necessidade, período, sistema e responsável. As atividades realizadas são registradas e depois revisadas pelo controller ou responsável definido.</p></div><div class="lesson"><h3>Quando usar</h3><p>Incidentes críticos, correções urgentes, atividades de suporte ou situações excepcionais em que o acesso normal não é suficiente e o tempo de resposta é importante.</p></div><div class="lesson"><h3>Controles indispensáveis</h3><p>Owner e controller definidos, justificativa, validade curta, logs completos, revisão posterior, tratamento de exceções e proibição de usar Firefighter como substituto permanente de um desenho de acesso correto.</p></div>`},
 btpAccounts:{title:"Global Account & Subaccounts — Estrutura segura",area:"SAP BTP",body:`<div class="lesson"><h3>Para que serve</h3><p>Global Account, directories e subaccounts organizam a paisagem BTP. A segurança começa separando ambientes, responsabilidades e entitlements para evitar administração excessivamente centralizada.</p></div><div class="lesson"><h3>O que revisar</h3><p>Administradores de Global Account, membros de subaccounts, entitlements, regiões, contas produtivas versus não produtivas, ownership e acesso de equipes externas.</p></div><div class="lesson"><h3>Boa prática</h3><p>Use menor privilégio, segregue produção de desenvolvimento, mantenha poucos administradores globais e revise acessos de plataforma periodicamente.</p></div>`},
 btpRoles:{title:"IAM & Role Collections — Autorização no BTP",area:"SAP BTP",body:`<div class="lesson"><h3>Para que serve</h3><p>Role Collections agrupam roles técnicas em conjuntos de negócio para atribuição a usuários e grupos. Elas são o ponto central de autorização em muitos cenários BTP.</p></div><div class="lesson"><h3>Risco principal</h3><p>Coleções administrativas amplas, atribuições diretas sem owner e acúmulo de privilégios podem dar acesso a configuração, serviços e dados sensíveis.</p></div><div class="lesson"><h3>Boas práticas</h3><p>Separar administração de visualização, atribuir por grupo quando possível, recertificar acessos e controlar roles com privilégios críticos.</p></div>`},
 btpIAS:{title:"IAS / Trust — Identidade e autenticação",area:"SAP BTP",body:`<div class="lesson"><h3>Para que serve</h3><p>SAP Cloud Identity Services pode atuar como camada de identidade para autenticação, SSO, MFA e federação com o provedor corporativo.</p></div><div class="lesson"><h3>O que governar</h3><p>Trust configuration, grupos, atributos, políticas de autenticação, MFA para perfis privilegiados, ciclo de vida de usuários e integração com diretórios corporativos.</p></div><div class="lesson"><h3>Resultado esperado</h3><p>Identidade centralizada, menos credenciais locais e maior rastreabilidade sobre quem autentica e como recebe autorização.</p></div>`},
 btpConnector:{title:"Cloud Connector — Conectividade segura",area:"SAP BTP",body:`<div class="lesson"><h3>Para que serve</h3><p>Cria um canal controlado entre aplicações BTP e recursos on-premise sem expor diretamente os sistemas internos à internet.</p></div><div class="lesson"><h3>O que revisar</h3><p>Sistemas mapeados, recursos e paths expostos, administradores, certificados, disponibilidade, logs e princípio de exposição mínima.</p></div><div class="lesson"><h3>Risco principal</h3><p>Expor mais recursos do que o necessário ou manter administração ampla pode ampliar o impacto de uma credencial comprometida.</p></div>`},
 btpIntegration:{title:"Integration Suite — Segurança de integrações",area:"SAP BTP",body:`<div class="lesson"><h3>Para que serve</h3><p>Centraliza integrações, APIs e fluxos entre SAP, parceiros e aplicações. Segurança envolve autenticação, autorização, certificados, keystore, secrets, endpoints e monitoramento.</p></div><div class="lesson"><h3>Controles importantes</h3><p>OAuth 2.0 quando aplicável, certificados com ciclo de vida controlado, secrets fora de scripts, validação de payload, menor privilégio nos adaptadores e logs para troubleshooting e auditoria.</p></div><div class="lesson"><h3>Operação</h3><p>Monitore falhas, expiração de certificados, mudanças em endpoints, volumes anormais e integrações críticas de negócio.</p></div>`},
 btpRuntime:{title:"Cloud Foundry & Kyma — Segurança de runtime",area:"SAP BTP",body:`<div class="lesson"><h3>Cloud Foundry</h3><p>Controle organizações, spaces, roles técnicas, service bindings, variáveis e credenciais. Perfis de desenvolvedor podem ter acesso a dados sensíveis e devem ser restritos em produção.</p></div><div class="lesson"><h3>Kyma</h3><p>Kyma usa RBAC do Kubernetes com Roles, ClusterRoles, RoleBindings e ClusterRoleBindings. Separe operadores de desenvolvedores e limite cluster-admin.</p></div><div class="lesson"><h3>Boas práticas</h3><p>Segregação por ambiente, secrets protegidos, logging, imagens confiáveis, revisão de bindings e redução de privilégios permanentes.</p></div>`},
 govPolicies:{title:"Políticas & Diretrizes — SAP Governança",area:"SAP Governança",body:`<div class="lesson"><h3>Objetivo</h3><p>Transformar princípios de segurança em regras claras: quem pode solicitar, aprovar, administrar, revisar e aceitar riscos.</p></div><div class="lesson"><h3>Conteúdo mínimo</h3><p>Política de acessos, privileged access, contas técnicas, recertificação, SoD, evidências, exceções, retenção de logs e responsabilidades.</p></div>`},
 govRisks:{title:"Riscos & Controles — SAP Governança",area:"SAP Governança",body:`<div class="lesson"><h3>Objetivo</h3><p>Manter visão única de risco, controle, responsável, prazo e situação. O risco deve estar ligado a uma decisão, não apenas a um relatório.</p></div><div class="lesson"><h3>Prática</h3><p>Classifique impacto e probabilidade, associe controles preventivos/detectivos, defina owner e acompanhe plano de ação até o encerramento.</p></div>`},
 govRecert:{title:"Recertificação — SAP Governança",area:"SAP Governança",body:`<div class="lesson"><h3>Objetivo</h3><p>Confirmar periodicamente se usuários, roles, acessos críticos e exceções continuam necessários.</p></div><div class="lesson"><h3>Boa recertificação</h3><p>Tem owner correto, prazo, evidência da decisão, tratamento de não resposta e remoção efetiva do acesso rejeitado.</p></div>`},
 govMetrics:{title:"Indicadores & KRIs — SAP Governança",area:"SAP Governança",body:`<div class="lesson"><h3>Indicadores úteis</h3><p>Conflitos SoD abertos, tempo de remediação, acessos privilegiados, Firefighters sem revisão, usuários inativos, exceções vencidas, vulnerabilidades críticas e controles sem evidência.</p></div><div class="lesson"><h3>Valor executivo</h3><p>Mostram tendência, exposição e capacidade de resposta, permitindo priorizar investimento e cobrar responsáveis.</p></div>`},

function threatScore(v){
 let sev=String(v.severity||'HIGH').toUpperCase();
 let score={CRITICAL:88,HIGH:72,MEDIUM:48,LOW:25}[sev]||55;
 let txt=(String(v.title||'')+' '+String(v.description||'')+' '+String(v.external_id||v.cve||'')).toLowerCase();
 if(/cve-\d{4}-\d+/.test(txt)) score+=4;
 if(/exploit|rce|remote code|authentication bypass|privilege escalation|actively exploited|kev/.test(txt)) score+=7;
 if(/internet|public|external|exposed/.test(txt)) score+=4;
 return Math.min(100,score);
}
function threatLevel(score){return score>=90?'CRÍTICO':score>=75?'ALTO':score>=50?'MODERADO':'BAIXO'}

let currentVulnerabilityAIContext=null;
function analyzeVulnerability(vraw){
 let v=typeof vraw==='string'?JSON.parse(vraw):vraw;
 let sev=String(v.severity||'HIGH').toUpperCase(),priority=sev==='CRITICAL'?'Imediata':sev==='HIGH'?'Alta':sev==='MEDIUM'?'Média':'Planejada';
 currentVulnerabilityAIContext={
  cve:v.external_id||v.cve||'',
  title:v.title||v.external_id||'Vulnerabilidade SAP',
  system:v.system_name||'SAP',
  severity:sev,
  status:v.status||'OPEN',
  description:v.description||''
 };
 let score=threatScore(v),level=threatLevel(score);
 let result=`<div class="card" style="margin-top:12px"><div class="docs-head"><div><h2>🛡️ SAP Threat Score™</h2><p class="muted">Priorização técnica inicial da ameaça</p></div><div style="font-size:28px;font-weight:800">${score}/100 — ${level}</div></div></div>
 <div class="grid" style="margin-top:12px"><div class="card"><h3>🔴 Analisar Ameaça</h3><p>Correlaciona CVE, severidade, exploração conhecida e impacto.</p></div><div class="card"><h3>🎯 Verificar Exposição</h3><p>Valida componente, versão, superfície exposta e controles.</p></div><div class="card"><h3>🛡️ Plano de Remediação</h3><p>Prioriza mitigação, correção, testes e janela de mudança.</p></div><div class="card"><h3>📑 Gerar Evidência</h3><p>Define evidências para auditoria e encerramento do risco.</p></div></div>
 <div class="lesson" style="margin-top:12px"><h3>Análise orientada</h3>
 <p><b>Vulnerabilidade:</b> ${esc(currentVulnerabilityAIContext.title)}</p>
 <p><b>CVE:</b> ${esc(currentVulnerabilityAIContext.cve||'Não informada')}</p>
 <p><b>Sistema:</b> ${esc(currentVulnerabilityAIContext.system)}</p>
 <p><b>Severidade:</b> ${esc(sev)}</p><p><b>Prioridade inicial:</b> ${priority}</p></div>
 <div class="lesson"><h3>Plano inicial de resposta</h3><ol>
 <li>Confirmar se o componente e a versão afetados existem no ambiente.</li>
 <li>Validar exposição, exploração conhecida e controles compensatórios.</li>
 <li>Consultar nota/correção oficial do fornecedor.</li>
 <li>Planejar correção, teste e janela de mudança.</li>
 <li>Registrar evidência da remediação e revalidar o risco.</li></ol></div>
 <div class="actions"><button class="btn" onclick="refreshGenericWithAI(currentVulnerabilityAIContext.title,'Vulnerabilidades',currentVulnerabilityAIContext)">Executar Threat Intelligence</button></div>
 <div id="genericAIResult"></div>`;
 let out=document.getElementById('vaResult');if(out){out.innerHTML=result;return}
 let e=document.createElement('div');e.className='modalback';e.id='detailModal';e.innerHTML=`<div class="modal"><button class="close" onclick="closeDetail()">Fechar</button><h2>Analisar vulnerabilidade</h2>${result}</div>`;document.body.appendChild(e)
}

function openPdf(key){window.open('/media-api?action=download&key='+key,'_blank','noopener')}
async function uploadPdf(moduleKey){
 if(session?.role==='GUEST'){showLogin();return}
 let file=document.getElementById('docFile_'+moduleKey)?.files?.[0], title=document.getElementById('docTitle_'+moduleKey)?.value?.trim();
 if(!file){toast('Selecione um arquivo PDF');return}
 if(file.type!=='application/pdf' && !file.name.toLowerCase().endsWith('.pdf')){toast('Envie somente arquivo PDF');return}
 if(file.size>4*1024*1024){toast('PDF acima de 4 MB. Reduza o arquivo para esta versão.');return}
 let fd=new FormData();fd.append('module',moduleKey);fd.append('type','pdf'); fd.append('title',title||file.name.replace(/\.pdf$/i,''));fd.append('file',file);
 try{
  let r=await fetch('/media-api',{method:'POST',headers:session?.token?{Authorization:'Bearer '+session.token}:{},body:fd});
  let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Falha no upload');toast('PDF publicado');render();
 }catch(e){toast(e.message)}
}
async function deletePdf(key,moduleKey){
 if(!confirm('Excluir este PDF?'))return;
 try{let r=await fetch('/media-api?key='+key,{method:'DELETE',headers:session?.token?{Authorization:'Bearer '+session.token}:{}});let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Falha ao excluir');toast('PDF excluído');render()}catch(e){toast(e.message)}
}


async function mediaLibraryPanel(moduleKey,moduleLabel){
 let items=[];
 try{
  let r=await fetch('/media-api?action=list&module='+encodeURIComponent(moduleKey));
  let j=await r.json().catch(()=>({items:[]}));
  if(r.ok) items=j.items||[];
 }catch(e){}
 let admin=session?.role!=='GUEST';
 return `<div class="card" style="margin-top:16px"><div class="docs-head"><div><h3>Biblioteca de Conteúdo — ${esc(moduleLabel)}</h3><p class="muted">Publique PDFs, documentos, vídeos, áudios e materiais. Os arquivos ficam armazenados no projeto.</p></div><span class="tag">${items.length} item${items.length===1?'':'s'}</span></div>
 <div class="docs-list">${items.length?items.map(d=>`<div class="doc-row"><div class="doc-info"><b>${mediaIcon(d.type)} ${esc(d.title||d.name)}</b><div class="doc-meta">${esc(d.name)} • ${esc(d.type||'arquivo')} • ${fmtBytes(d.size)} • ${d.uploadedAt?new Date(d.uploadedAt).toLocaleDateString('pt-BR'):''}</div></div><div class="doc-actions"><button class="btn secondary" onclick="openMedia('${encodeURIComponent(d.key)}')">Abrir</button>${admin?`<button class="btn danger" onclick="deleteMedia('${encodeURIComponent(d.key)}')">Excluir</button>`:''}</div></div>`).join(''):'<div class="notice">Nenhum material publicado ainda.</div>'}</div>
 ${admin?`<div class="upload-box"><b>Adicionar novo material</b><div class="upload-grid"><div><label>Título</label><input id="mediaTitle_${esc(moduleKey)}" placeholder="Título do material"></div><div><label>Tipo</label><select id="mediaType_${esc(moduleKey)}"><option value="pdf">PDF</option><option value="documento">Documento</option><option value="video">Vídeo</option><option value="audio">Áudio</option><option value="material">Material</option></select></div><div><label>Escolher arquivo</label><input id="mediaFile_${esc(moduleKey)}" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.mp3,.wav,.m4a,.mp4,.webm,.mov,application/pdf,audio/*,video/*"></div><button class="btn" onclick="uploadMedia('${esc(moduleKey)}')">Publicar arquivo</button></div><div class="mini-note">O arquivo só aparece como publicado depois que o servidor confirmar o armazenamento.</div></div>`:''}</div>`;
}
function mediaIcon(t){return t==='video'?'🎬':t==='audio'?'🎧':t==='pdf'?'📄':'📎'}
function openMedia(key){window.open('/media-api?action=download&key='+key,'_blank','noopener')}
async function uploadMedia(moduleKey){
 if(session?.role==='GUEST'){showLogin();return}
 let file=document.getElementById('mediaFile_'+moduleKey)?.files?.[0];
 let title=document.getElementById('mediaTitle_'+moduleKey)?.value?.trim();
 let type=document.getElementById('mediaType_'+moduleKey)?.value||'material';
 if(!file){toast('Escolha um arquivo para publicar');return}
 let fd=new FormData(); fd.append('module',moduleKey); fd.append('type','pdf'); fd.append('title',title||file.name); fd.append('type',type); fd.append('file',file);
 try{
  toast('Publicando arquivo...');
  let r=await fetch('/media-api',{method:'POST',headers:session?.token?{Authorization:'Bearer '+session.token}:{},body:fd});
  let j=await r.json().catch(()=>({}));
  if(!r.ok) throw Error(j.error||'Falha ao publicar arquivo');
  toast('Arquivo publicado com sucesso');
  render();
 }catch(e){toast('Erro ao publicar: '+e.message)}
}
async function deleteMedia(key){
 if(!confirm('Excluir este arquivo publicado?'))return;
 try{
  let r=await fetch('/media-api?key='+key,{method:'DELETE',headers:session?.token?{Authorization:'Bearer '+session.token}:{}});
  let j=await r.json().catch(()=>({}));
  if(!r.ok) throw Error(j.error||'Falha ao excluir');
  toast('Arquivo excluído'); render();
 }catch(e){toast('Erro: '+e.message)}
}
