@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.side{position:static;width:auto}.main{margin:0;width:auto}.app{display:block}.grid{grid-template-columns:1fr}}

function localSave(){localStorage.setItem(LOCAL_KEY,JSON.stringify(localDB))}

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function toast(t){let e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
async function api(path,opt={}){
 try{
  opt.headers={...(opt.headers||{}),"Content-Type":"application/json"};
  if(session?.token)opt.headers.Authorization="Bearer "+session.token;
  let r=await fetch(API+path,opt); let j=await r.json().catch(()=>({}));
  if(!r.ok)throw Error(j.error||"Erro API"); return j;
 }catch(e){
  if(path==="/api/health") return {ok:true,db:"DEMO LOCAL"};
  if(path==="/api/vulnerabilities" && (!opt.method||opt.method==="GET")) return localDB.vulnerabilities;
  if(path==="/api/vulnerabilities" && opt.method==="POST"){
    let b=JSON.parse(opt.body||"{}"), id="VUL-"+String(localDB.vulnerabilities.length+1).padStart(3,"0");
    let v={id,external_id:id,title:b.title,system_name:b.system_name,severity:b.severity,status:"OPEN"};
    localDB.vulnerabilities.unshift(v); localDB.audit.unshift({created_at:new Date().toLocaleString("pt-BR"),action:"vulnerability.create",resource_type:"vulnerability",user_email:session?.email}); localSave(); return v;
  }
  if(path==="/api/users") return localDB.users;
  if(path==="/api/grc/risks") return localDB.grcRisks;
  if(path==="/api/btp/assets") return localDB.btpAssets;
  if(path==="/api/tickets") return localDB.tickets;
  if(path==="/api/compliance/controls") return localDB.controls;
  if(path==="/api/billing/plans") return localDB.plans;
  if(path==="/api/integrations") return localDB.integrations;
  if(path==="/api/audit") return localDB.audit;
  if(path.includes("/api/integrations/")&&path.endsWith("/test")) return {status:"DEMO",message:"Conector navegável. A integração real será ativada com endpoint e credenciais do cliente."};
  throw e;
 }
}

function loginPage(){return `<div class="login"><div class="loginbox"><div class="brand">SAP <span>Security Hub</span></div><h2>Acesso SaaS</h2><p class="muted">Demo navegável — funciona diretamente no navegador:</p><label>E-mail</label><input id="email" value="admin@demo.local"><label>Senha</label><input id="pass" type="password" value="Admin@123"><button class="btn" style="width:100%" onclick="login()">Entrar no SAP Security Hub</button><button class="btn secondary" style="width:100%;margin-top:8px" onclick="location.href=API+'/auth/login?redirect=/'">Entrar com SSO / MFA</button><p class="muted">Modo: produção/API quando hospedado; demonstração local ao abrir o HTML</p></div></div>`}
async function login(){
 try{
  let r=await api("/api/auth/login",{method:"POST",body:JSON.stringify({email:email.value,password:pass.value})});
  session={token:r.access_token,...r.user};
 }catch(e){
  session={token:"demo-local",id:"USR-001",email:email.value||"admin@demo.local",name:"Security Admin",role:"TENANT_ADMIN",tenant_id:"tenant-demo",tenant_name:"Demo Corporation"};
 }
 sessionStorage.setItem("ssh_session",JSON.stringify(session));render();toast("SAP Security Hub aberto");
}
function logout(){sessionStorage.removeItem("ssh_session");session=null;render()}

async function security(){return `<h1>SAP Security</h1><p class="muted">Base para roles, usuários, privilégios e evidências.</p><div class="grid"><div class="card"><h3>Roles</h3><p>PFCG / SU24 / revisão de autorizações.</p></div><div class="card"><h3>Identity</h3><p>Usuários SAP e contas técnicas.</p></div><div class="card"><h3>Risk Engine</h3><p>Normalização de achados e riscos.</p></div><div class="card"><h3>Evidence</h3><p>Base para trilha de auditoria.</p></div></div>`}
async function vulnerabilities(){let vs=await api("/api/vulnerabilities");return `<h1>Vulnerabilidades</h1><p class="muted">CRUD real via backend.</p><button class="btn" onclick="createV()">+ Nova vulnerabilidade</button><div class="card" style="margin-top:15px"><table class="table"><tr><th>ID</th><th>Título</th><th>Sistema</th><th>Severidade</th><th>Status</th></tr>${vs.map(v=>`<tr><td>${esc(v.external_id||v.id.slice(0,8))}</td><td>${esc(v.title)}</td><td>${esc(v.system_name||"-")}</td><td><span class="tag">${esc(v.severity)}</span></td><td>${esc(v.status)}</td></tr>`).join("")}</table></div>`}
async function createV(){let title=prompt("Título da vulnerabilidade");if(!title)return;let system_name=prompt("Sistema","S/4HANA")||"SAP";let severity=(prompt("CRITICAL / HIGH / MEDIUM / LOW","HIGH")||"HIGH").toUpperCase();try{await api("/api/vulnerabilities",{method:"POST",body:JSON.stringify({title,system_name,severity})});toast("Vulnerabilidade criada");render()}catch(e){toast(e.message)}}

async function tickets(){

 <button class="btn" onclick="newTicket()">+ Novo ticket</button>
 <div class="card" style="margin-top:15px"><table class="table"><tr><th>ID</th><th>Título</th><th>Prioridade</th><th>Status</th><th>Área</th><th>Ação</th></tr>

function newTicket(){let title=prompt("Título do ticket");if(!title)return;let id="INC-"+(1001+localDB.tickets.length);localDB.tickets.unshift({id,title,priority:"Média",status:"Aberto",area:"SAP Security"});localDB.audit.unshift({created_at:new Date().toLocaleString("pt-BR"),action:"ticket.create",resource_type:"ticket",user_email:session.email});localSave();render();toast(id+" criado")}
function advanceTicket(id){let t=localDB.tickets.find(x=>x.id===id);if(!t)return;let s=["Aberto","Em andamento","Resolvido"];t.status=s[(s.indexOf(t.status)+1)%s.length];localSave();render();toast(id+" → "+t.status)}

 document.getElementById("view").innerHTML=`<button class="btn secondary" onclick="render()">← Voltar à Academy</button>
 <div class="card" style="margin-top:15px"><div class="tag ok">${esc(c.level)}</div><h1>${esc(c.name)}</h1><p>${esc(c.desc)}</p><p><b>Carga estimada:</b> ${c.hours}h · <b>${c.modules.length} módulos</b></p></div>
 <div class="grid">${c.modules.map((m,i)=>`<div class="card"><div class="tag">Módulo ${i+1}</div><h3>${esc(m[0])}</h3><p>${esc(m[1])}</p><button class="btn secondary" onclick="openLesson('${c.id}',${i})">Abrir aula</button></div>`).join("")}</div>`;
}
function openLesson(id,n){
 let c=localDB.courses.find(x=>x.id===id),m=c?.modules?.[n];if(!m)return;
 document.getElementById("view").innerHTML=`<button class="btn secondary" onclick="openCourse('${id}')">← Voltar ao curso</button>
 <div class="card" style="margin-top:15px"><div class="tag ok">${esc(c.name)}</div><h1>${esc(m[0])}</h1><p>${esc(m[1])}</p>
 <hr><h3>Objetivos da aula</h3><ul><li>Compreender o conceito e sua aplicação no ambiente SAP.</li><li>Relacionar o tema com risco, segurança e governança.</li><li>Aplicar o conhecimento em um cenário prático.</li></ul>
 <h3>Prática orientada</h3><p>Revise o cenário, identifique os controles envolvidos, documente a decisão e registre a evidência esperada.</p>
 <h3>Checklist</h3><p>☐ Conceito compreendido &nbsp; ☐ Cenário analisado &nbsp; ☐ Controle identificado &nbsp; ☐ Evidência registrada</p>
 <h3>Quiz rápido</h3><p>Qual é o principal objetivo deste controle no contexto apresentado?</p>
 <button class="btn" onclick="completeLesson('${id}',${n})">Concluir aula</button></div>`;
}
function completeLesson(id,n){
 let c=localDB.courses.find(x=>x.id===id);if(!c)return;
 c.done=c.done||[];if(!c.done.includes(n))c.done.push(n);
 c.progress=Math.round(c.done.length/c.modules.length*100);localSave();toast("Aula concluída · progresso "+c.progress+"%");openCourse(id);
}
async function ai(){
 return `<h1>IA / Joule</h1><p class="muted">Security Copilot para riscos, SoD, vulnerabilidades e evidências.</p>
 <div class="grid">
  <div class="card"><h3>Analisar vulnerabilidade</h3><p>Explica risco, impacto e próximos passos.</p><button class="btn" onclick="aiRun('vuln')">Analisar</button></div>
  <div class="card"><h3>Analisar SoD</h3><p>Resume o conflito e sugere mitigação.</p><button class="btn" onclick="aiRun('sod')">Analisar</button></div>
  <div class="card"><h3>Gerar evidência</h3><p>Estrutura evidência para auditoria.</p><button class="btn" onclick="aiRun('evidence')">Gerar</button></div>
  <div class="card"><h3>Assistente</h3><p>Consulta contextual sobre o tenant.</p><button class="btn" onclick="aiRun('chat')">Abrir</button></div>
 </div>
 <div class="notice" id="aiout">A camada de IA está em modo navegável. Em produção será ligada a um provedor autorizado com RBAC, logs e governança.</div>`
}
async function aiRun(type){
 let localMsg=type==="sod"?"Conflito SoD detectado: validar funções incompatíveis, impacto financeiro e controle compensatório.":type==="evidence"?"Evidência estruturada: usuário, role, risco, decisão, responsável, data e aprovação.":"Análise: priorizar risco, validar autorização, aplicar menor privilégio e registrar evidência.";
 try{
   let r=await api("/api/ai/analyze",{method:"POST",body:JSON.stringify({type,context:"tenant_security_context"})});
   document.getElementById("aiout").textContent=r.analysis||localMsg;
 }catch(e){document.getElementById("aiout").textContent=localMsg}
 localDB.audit.unshift({created_at:new Date().toLocaleString("pt-BR"),action:"ai.analyze",resource_type:type,user_email:session.email});localSave()
}

}

async function integrations(){let x=await api("/api/integrations");return `<h1>Integrações</h1><p class="muted">Configuração segura por tenant.</p><div class="grid">${["SAP","GRC","BTP"].map(k=>{let i=x.find(a=>a.kind===k);return `<div class="card"><h3>${k}</h3><p>Status: ${esc(i?.status||"NOT_CONFIGURED")}</p><button class="btn" onclick="testInt('${k.toLowerCase()}')">Testar</button></div>`}).join("")}</div><div class="notice">O banco guarda apenas secret_ref. Credenciais reais devem ficar em Secrets Manager/Vault.</div>`}

async function render(){app.innerHTML=session?shell():loginPage();if(!session)return;try{view.innerHTML=await ({dashboard,security,grc,btp,vulnerabilities,compliance,tickets,academy,ai,billing,users,integrations,audit,settings}[route()]||dashboard)()}catch(e){view.innerHTML=`<div class="notice">Erro: ${esc(e.message)}. Confira se a API está em ${esc(API)}.</div>`}}
window.onhashchange=render;render();
</script></body></html>
